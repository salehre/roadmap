<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رودمپ پروژه‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb;
    --ink:#141414;
    --ink-dim:#5b5b5b;
    --line:#111111;
    --blue:#2f6fed;
    --yellow:#fdf000;
    --tan:#f6d9a3;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    overflow:hidden;
  }

  /* ===== Page layout: main content + push sidebar ===== */
  .page{
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  .main-content{
    flex:1 1 auto;
    min-width:0;
    height:100vh;
    overflow-y:auto;
    /* صفحه کلاً RTL هست، پس اسکرول‌بار طبیعتاً سمت چپ می‌افته (همون سمتی که
       سایدبار بازمی‌شه). با LTR کردن خودِ این باکس، اسکرول‌بار همیشه سمت
       راست (مخالفِ سایدبار) می‌شینه؛ محتوای داخلش رو با .content-rtl دوباره
       RTL می‌کنیم که متن‌ها درست بمونن. */
    direction:ltr;
  }
  .content-rtl{
    direction:rtl;
  }

  /* ===== Header ===== */
  .hero{
    max-width:820px;
    margin:0 auto;
    padding:56px 28px 20px;
    text-align:center;
  }
  .hero .eyebrow{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    color:#fff;
    background:var(--blue);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .hero h1{
    font-size:clamp(26px, 4.6vw, 40px);
    font-weight:800;
    margin:0 0 12px;
  }
  .hero p{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.9;
    max-width:520px;
    margin:0 auto;
  }
  .hint{
    margin-top:18px;
    display:inline-block;
    font-size:12px;
    color:#888;
    border:1px dashed #c9c9c9;
    padding:6px 14px;
    border-radius:999px;
  }

  /* ===== Roadmap ===== */
  .roadmap{
    position:relative;
    max-width:760px;
    margin:20px auto 100px;
    padding:20px 24px;
  }
  svg.connectors{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
    z-index:0;
    pointer-events:none;
  }
  .connector-line{
    fill:none;
    stroke:var(--blue);
    stroke-width:3;
  }
  .tag-connector{
    fill:none;
    stroke:var(--blue);
    stroke-width:2;
    stroke-dasharray:1 7;
    stroke-linecap:round;
  }

  .step{
    position:relative;
    z-index:1;
    display:flex;
    margin-bottom:86px;
  }
  .step:last-child{margin-bottom:0;}
  .step.side-right{justify-content:flex-start;}
  .step.side-left{justify-content:flex-end;}

  .stack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    max-width:260px;
  }
  .step.side-right .stack{align-items:flex-start;}
  .step.side-left .stack{align-items:flex-end;}

  .tags-col{
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .box{
    border:2px solid var(--line);
    border-radius:var(--radius);
    padding:10px 18px;
    font-size:14px;
    font-weight:600;
    text-align:center;
    white-space:nowrap;
    background:#fff;
  }
  .tag-box{
    background:var(--tan);
    color:#2a2004;
  }
  .hub-btn{
    all:unset;
    cursor:pointer;
  }
  .hub-box{
    background:var(--yellow);
    color:#141414;
    font-size:15px;
    padding:8px 26px;
    box-shadow:0 2px 0 rgba(0,0,0,.08);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .hub-btn:hover .hub-box{
    transform:translateY(-3px);
    box-shadow:0 8px 18px -8px rgba(47,111,237,.55);
    border-color:var(--blue);
  }
  .hub-btn:focus-visible .hub-box{
    outline:2px solid var(--blue);
    outline-offset:3px;
  }
  .hub-box.done{background:#fff; border-color:var(--blue); color:var(--blue);}

  .step-label{
    font-size:11px;
    font-weight:700;
    color:#9a9a9a;
    letter-spacing:.06em;
    margin-bottom:2px;
  }

  @media (max-width: 640px){
    .step.side-right, .step.side-left{justify-content:center;}
    .step .stack{align-items:center !important; max-width:100%;}
    svg.connectors{display:none;}
    .step{margin-bottom:56px;}
  }

  /* ===== Sidebar (push panel, resizable) ===== */
  .sidebar{
    flex:0 0 auto;
    width:0;
    height:100vh;
    overflow:hidden;
    background:#ffffff;
    color:#141414;
    display:flex;
    flex-direction:column;
    direction:rtl;
    transition:width .38s cubic-bezier(.22,.9,.3,1);
  }
  /* در حالت باز، عرض دقیق رو جاوااسکریپت به‌صورت inline style تنظیم می‌کنه
     (چه در باز شدن اولیه، چه موقع کشیدن دستگیره)، پس اینجا دیگه width:50%
     ثابت نذاشتیم. */

  /* ===== Resizer handle بین دو سکشن ===== */
  .resizer{
    flex:0 0 auto;
    width:0;
    height:100vh;
    position:relative;
    cursor:col-resize;
    touch-action:none;
    transition:width .38s cubic-bezier(.22,.9,.3,1);
    z-index:5;
  }
  .resizer.open{width:16px;}
  .resizer .resizer-line{
    position:absolute;
    top:0; bottom:0; left:50%;
    width:2px;
    background:#e4e4e4;
    transform:translateX(-50%);
    transition:background .2s ease;
  }
  .resizer .resizer-grip{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:5px;
    height:52px;
    border-radius:999px;
    background:#cfcfcf;
    border:2px solid var(--line);
    transition:background .2s ease, height .2s ease;
  }
  .resizer:hover .resizer-line,
  .resizer.dragging .resizer-line{background:var(--blue);}
  .resizer:hover .resizer-grip,
  .resizer.dragging .resizer-grip{background:var(--blue); height:64px;}
  .resizer.dragging{transition:none;}
  .resizer.dragging + .sidebar,
  .page.no-transition .sidebar{transition:none;}

  @media (max-width: 640px){
    .resizer{display:none;}
  }

  .sidebar-inner{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    /* keeps content from reflowing/wrapping weirdly while the panel is animating its width */
    min-width:320px;
  }

  .sidebar-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:22px 24px 18px;
    border-bottom:2px solid #f0f0f0;
    flex:0 0 auto;
  }
  .sidebar-header .kicker{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--blue);
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .sidebar-header h2{
    margin:0;
    font-size:21px;
    font-weight:800;
    line-height:1.4;
  }
  .sidebar-close{
    all:unset;
    cursor:pointer;
    width:32px; height:32px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:#666;
    flex:0 0 auto;
    transition:background .2s ease, color .2s ease;
  }
  .sidebar-close:hover{background:#f1f1f1; color:#141414;}

  .sidebar-body{
    padding:22px 24px 32px;
    overflow-y:auto;
    line-height:1.95;
    font-size:15px;
    flex:1 1 auto;
  }
  .status-pill{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    background:var(--yellow);
    border:2px solid var(--line);
    margin-bottom:18px;
  }
  .sidebar-body p{margin:0 0 16px;}
  .sidebar-body .tags{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-top:22px; padding-top:18px;
    border-top:2px solid #f0f0f0;
  }
  .tag-chip{
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:8px;
    background:var(--tan);
    border:2px solid var(--line);
    color:#2a2004;
  }
</style>
</head>
<body>

<div class="page">
  <main class="main-content" id="mainContent">
    <div class="content-rtl">
      <div class="hero">
        <div class="eyebrow">نقشهٔ راه</div>
        <h1>رودمپ پروژه‌ها</h1>
        <p>مسیری از پروژه‌هایی که ساخته شده یا در حال ساخت هستند. روی هر جعبهٔ زرد کلیک کن تا جزئیاتش باز شود.</p>
        <div class="hint">برای ویرایش، آرایهٔ projects در پایین فایل را تغییر بده</div>
      </div>

      <div class="roadmap" id="roadmap">
        <svg class="connectors" id="connSvg">
          <path class="connector-line" id="mainPath" d=""></path>
        </svg>
        <div id="steps"></div>
      </div>
    </div>
  </main>

  <div class="resizer" id="resizer">
    <span class="resizer-line"></span>
    <span class="resizer-grip"></span>
  </div>

  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <div class="meta">
          <span class="kicker" id="sbKicker">پروژه</span>
          <h2 id="sbTitle">—</h2>
        </div>
        <button class="sidebar-close" id="sbClose" aria-label="بستن">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="sidebar-body">
        <span class="status-pill" id="sbStatus">در حال ساخت</span>
        <div id="sbDescription"></div>
        <div class="tags" id="sbTags"></div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ============================================================
   برای اضافه یا ویرایش پروژه‌ها فقط همین آرایه را تغییر بده.
   tags همون جعبه‌های کوچیک قهوه‌ای بالای هر پروژه‌ان (اختیاری).
============================================================ */
const projects = [
  {
    title: "نام پروژهٔ اول",
    status: "تکمیل‌شده",
    description: "یک یا دو پاراگراف دربارهٔ این پروژه بنویس؛ چه مشکلی رو حل می‌کنه و چه تکنولوژی‌هایی توش استفاده شده.",
  },
  {
    title: "نام پروژهٔ دوم",
    status: "در حال ساخت",
    description: "توضیح این پروژه رو اینجا بنویس.",
  },
  {
    title: "نام پروژهٔ سوم",
    status: "برنامه‌ریزی‌شده",
    description: "توضیح این پروژه رو اینجا بنویس.",
  },
  {
    title: "نام پروژهٔ چهارم",
    status: "تکمیل‌شده",
    description: "توضیح این پروژه رو اینجا بنویس.",
  }
];

/* ============================================================
   از این پایین به بعد منطق ساخت صفحه است — نیازی به تغییر نیست
============================================================ */
const stepsEl = document.getElementById('steps');
const roadmap = document.getElementById('roadmap');
const mainPath = document.getElementById('mainPath');
const connSvg = document.getElementById('connSvg');
const mainContent = document.getElementById('mainContent');

projects.forEach((p, i) => {
  const side = i % 2 === 0 ? 'side-right' : 'side-left';
  const num = String(i + 1).padStart(2, '0');
  const tagsHtml = (p.tags && p.tags.length)
    ? `<div class="tags-col">${p.tags.map(t => `<div class="box tag-box">${t}</div>`).join('')}</div>`
    : '';
  const step = document.createElement('div');
  step.className = `step ${side}`;
  step.innerHTML = `
    <div class="stack">
      ${tagsHtml}
      <div>
        <div class="step-label">مرحلهٔ ${num}</div>
        <button class="hub-btn" data-index="${i}">
          <div class="box hub-box" data-hub="${i}">${p.title}</div>
        </button>
      </div>
    </div>
  `;
  stepsEl.appendChild(step);
});

function drawConnectors(){
  const wrapRect = roadmap.getBoundingClientRect();
  const hubs = Array.from(document.querySelectorAll('[data-hub]'));

  // main elbowed line between consecutive hub boxes
  if(hubs.length > 1){
    const pts = hubs.map(h => {
      const r = h.getBoundingClientRect();
      return { x: r.left + r.width/2 - wrapRect.left, y: r.top + r.height/2 - wrapRect.top };
    });
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let i=0; i<pts.length-1; i++){
      const a = pts[i], b = pts[i+1];
      // به‌جای رفتن تیز و صددرصد افقی از وسط، از دو نقطهٔ کنترل استفاده می‌کنیم
      // که هرکدوم فقط تا نیمهٔ فاصلهٔ x (نه کل فاصله) جابه‌جا می‌شن؛ این باعث می‌شه
      // خط بیشتر عمودی به‌نظر بیاد و فقط یه‌کم به چپ/راست منحرف بشه.
      const midY = (a.y + b.y) / 2;
      const cx1 = a.x + (b.x - a.x) * 0.15;
      const cx2 = b.x - (b.x - a.x) * 0.15;
      d += ` C ${cx1} ${midY}, ${cx2} ${midY}, ${b.x} ${b.y}`;
    }
    mainPath.setAttribute('d', d);
  }

  // dotted connectors from each tag box down to its hub box
  document.querySelectorAll('.tag-connector').forEach(el => el.remove());
  document.querySelectorAll('.stack').forEach(stack => {
    const hub = stack.querySelector('[data-hub]');
    if(!hub) return;
    const hubR = hub.getBoundingClientRect();
    const hubTop = { x: hubR.left + hubR.width/2 - wrapRect.left, y: hubR.top - wrapRect.top };
    stack.querySelectorAll('.tag-box').forEach(tag => {
      const tR = tag.getBoundingClientRect();
      const from = { x: tR.left + tR.width/2 - wrapRect.left, y: tR.bottom - wrapRect.top };
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'tag-connector');
      path.setAttribute('d', `M ${from.x} ${from.y} L ${hubTop.x} ${hubTop.y}`);
      connSvg.appendChild(path);
    });
  });

  connSvg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
  connSvg.setAttribute('preserveAspectRatio', 'none');
}

window.addEventListener('load', drawConnectors);
window.addEventListener('resize', drawConnectors);
setTimeout(drawConnectors, 60);

/* ===== Sidebar logic (push layout, no overlay) ===== */
const sidebar = document.getElementById('sidebar');
const sbTitle = document.getElementById('sbTitle');
const sbKicker = document.getElementById('sbKicker');
const sbStatus = document.getElementById('sbStatus');
const sbDescription = document.getElementById('sbDescription');
const sbTags = document.getElementById('sbTags');

// چون سایدبار عرض محتوای اصلی رو تغییر می‌ده، بعد از پایان انیمیشن
// باید موقعیت خط‌های اتصال دوباره محاسبه بشه
sidebar.addEventListener('transitionend', (e) => {
  if(e.propertyName === 'width'){ drawConnectors(); }
});
// در حین انیمیشن هم چند بار به‌روزرسانی کن تا نرم‌تر دنبال کنه
mainContent.addEventListener('transitionend', drawConnectors);

function openProject(i){
  const p = projects[i];
  sbKicker.textContent = `پروژهٔ ${String(i+1).padStart(2,'0')}`;
  sbTitle.textContent = p.title;
  sbStatus.textContent = p.status;
  sbDescription.innerHTML = p.description.split('\n').map(line => `<p>${line}</p>`).join('');
  sbTags.innerHTML = (p.tags || []).map(t => `<span class="tag-chip">${t}</span>`).join('');

  document.querySelectorAll('[data-hub]').forEach(hub => {
    hub.classList.toggle('done', Number(hub.dataset.hub) < i);
  });

  sidebar.classList.add('open');
  sidebar.setAttribute('aria-hidden', 'false');
}
function closeSidebar(){
  sidebar.classList.remove('open');
  sidebar.setAttribute('aria-hidden', 'true');
}

document.addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-index]');
  if(trigger){ openProject(Number(trigger.dataset.index)); }
});
document.getElementById('sbClose').addEventListener('click', closeSidebar);
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSidebar(); });
</script>
</body>
</html>
